# ============================================================================
# LiteLLM proxy config — provider-agnostic LLM plane for MATS.
# Binds to 127.0.0.1:4000. Pin >= v1.83.7-stable (CVE-2026-30623 fix).
# ============================================================================

model_list:
  # ---------------- Anthropic (Claude) -----------------------------------
  - model_name: claude-opus-4-7
    litellm_params:
      model: anthropic/claude-opus-4-7
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  # ---------------- Ollama (local) ---------------------------------------
  - model_name: ollama/qwen3:14b
    litellm_params:
      model: ollama/qwen3:14b
      api_base: os.environ/OLLAMA_HOST
  - model_name: ollama/qwen3-embedding:0.6b
    litellm_params:
      model: ollama/qwen3-embedding:0.6b
      api_base: os.environ/OLLAMA_HOST
  - model_name: ollama/nomic-embed-text
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: os.environ/OLLAMA_HOST

  # ---------------- OpenRouter (cloud fallback) --------------------------
  - model_name: openrouter/auto
    litellm_params:
      model: openrouter/anthropic/claude-3-sonnet
      api_key: os.environ/OPENROUTER_API_KEY

router_settings:
  routing_strategy: simple-shuffle
  fallbacks:
    - claude-sonnet-4-6: ["ollama/qwen3:14b", "openrouter/auto"]

litellm_settings:
  drop_params: true
  telemetry: false
  request_timeout: 120

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: null
  # MCP gateway role (LiteLLM v1.83.7+)
  mcp_servers:
    - name: mats-composite
      url: http://127.0.0.1:9010/mcp
      transport: streamable-http
