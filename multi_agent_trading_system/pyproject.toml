[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mats"
version = "0.1.0"
description = "Multi-Agent Trading System — Coinbase + PredictBase + Base + Wasabi + Allora + Venice"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MATS contributors" }]
dependencies = [
    "aiohttp>=3.9",
    "anyio>=4.3",
    "bm25s>=0.3.4",
    "fastapi>=0.110",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "redis>=5.0",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "sse-starlette>=1.8",
    "ta>=0.11",
    "uvicorn>=0.29",
    "web3>=6.15",
    "websockets>=12.0",
]

[project.optional-dependencies]
graph = ["kuzu>=0.11"]
vector = ["chromadb>=0.4"]
rl = ["torch>=2.2", "gymnasium>=0.29"]
all = ["mats[graph,vector,rl]"]

[project.scripts]
mats-orchestrator = "mats.scripts.run_orchestrator:main"
mats-mcp = "mats.scripts.run_mcp_server:main"
mats-consolidate = "mats.scripts.consolidate_agent:main"
mats-relay = "mats.relay.fastapi_relay:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mats*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

